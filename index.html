<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Silent Verse</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 16px;
      background-color: #0b0c10;
      color: #e0e0e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .cover-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid #1f2230;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      margin-bottom: 24px;
      object-fit: cover;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffffff;
    }
    p.tagline {
      margin: 0 0 28px 0;
      color: #9aa0a6;
      font-size: 1rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid #2b2f42;
      background: #141722;
      color: #f5f5f7;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover {
      background: #1d2130;
      border-color: #5865f2;
      transform: translateY(-2px);
    }
    .btn.primary {
      background: #8b1e1e;
      border-color: #a82828;
    }
    .btn.primary:hover {
      background: #a92727;
      border-color: #c93636;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Replace 'banner.png' with your uploaded artwork filename -->
    <img src="banner.png" alt="The Silent Verse Art" class="cover-image" />

    <h1>The Silent Verse</h1>
    <p class="tagline">Official Hub &amp; Tower Defense Playtest</p>

    <div class="links">
      <a href="https://thesilentverse.itch.io/tower-defense" target="_blank" class="btn primary">
        ⚔️ Play Tower Defense on itch.io
      </a>
      <a href="https://www.youtube.com/@TheSilentVerseOfficial" target="_blank" class="btn">
        🎬 Official YouTube &amp; Updates
      </a>
    </div>
  </div>

</body>
</html>
